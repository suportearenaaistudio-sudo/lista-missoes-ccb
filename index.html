<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema de gerenciamento das Listas de Missões - Congregação Cristã no Brasil, Região de Iporã-PR" />

    <!-- HTTP Anti-Cache Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />

    <!-- PWA / App -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e4d8c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CCB Iporã" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Lista de Missões — CCB Iporã</title>

    <!-- Open Graph / Social Media Preview (WhatsApp, Facebook, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lista de Missões — CCB Região de Iporã-PR" />
    <meta property="og:description" content="Agenda oficial dos eventos da Congregação Cristã no Brasil para a região de Iporã-PR." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="CCB Lista de Missões — Iporã-PR" />

    <!-- Twitter Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lista de Missões — CCB Região de Iporã-PR" />
    <meta name="twitter:description" content="Agenda oficial dos eventos da Congregação Cristã no Brasil para a região de Iporã-PR." />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Cor do topo = cabeçalho (antes do React, evita flash no iPhone) -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'light';
        var isPublic = window.innerWidth <= 1024 && !window.location.pathname.startsWith('/dev-admin');
        if (!isPublic) return;
        var top = theme === 'dark' ? '#2F3C46' : '#1e4d8c';
        var root = document.documentElement;
        root.classList.add('public-mobile-view');
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.classList.add('dark');
        }
        root.style.backgroundColor = top;
        document.body.style.backgroundColor = top;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', top);
      })();
    </script>
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
